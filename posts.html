---
title: "所有文章"
layout: splash
permalink: /posts/
excerpt: "依時間排列的全部文章。"
---
{% include page_head.html %}

{%- assign years = site.posts | group_by_exp: "p", "p.date | date: '%Y'" -%}
{%- for y in years %}
<section class="lab-section">
  <div class="lab-section__head">
    <h2 class="lab-section__title">{{ y.name }}</h2>
    <span class="lab-section__count">{{ y.items.size }} 篇</span>
  </div>
  {% include post_list.html posts=y.items %}
</section>
{%- endfor %}
